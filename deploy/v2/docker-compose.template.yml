name: ${COMPOSE_PROJECT_NAME:-digiledger-v2}

services:
  backend:
    build:
      context: ../../backend
    restart: unless-stopped
    environment:
      DL_DB_HOST: ${DL_DB_HOST}
      DL_DB_PORT: ${DL_DB_PORT}
      DL_DB_NAME: ${DL_DB_NAME}
      DL_DB_USER: ${DL_DB_USER}
      DL_DB_PASS: ${DL_DB_PASS}
      DL_SERVER_PORT: ${DL_SERVER_PORT}
      DL_FLYWAY_ENABLED: ${DL_FLYWAY_ENABLED}
      DL_AUTH_PASSWORD: ${DL_AUTH_PASSWORD:-}
      DL_AUTH_COOKIE_SECURE: ${DL_AUTH_COOKIE_SECURE:-true}
      DL_AUTH_COOKIE_SAME_SITE: ${DL_AUTH_COOKIE_SAME_SITE:-lax}
      DL_CORS_ALLOWED_ORIGIN_PATTERNS: ${DL_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:[*],https://localhost,https://localhost:[*],http://127.0.0.1:[*],http://[::1]:[*]}
      DL_STORAGE_PROVIDER: ${DL_STORAGE_PROVIDER}
      DL_STORAGE_ENDPOINT: ${DL_STORAGE_ENDPOINT}
      DL_STORAGE_REGION: ${DL_STORAGE_REGION}
      DL_STORAGE_BUCKET: ${DL_STORAGE_BUCKET}
      DL_STORAGE_ACCESS_KEY: ${DL_STORAGE_ACCESS_KEY}
      DL_STORAGE_SECRET_KEY: ${DL_STORAGE_SECRET_KEY}
      DL_STORAGE_BASE_URL: ${DL_STORAGE_BASE_URL}
    ports:
      - "${BACKEND_PORT}:${DL_SERVER_PORT}"

  frontend:
    build:
      context: ../..
      dockerfile: deploy/v2/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DL_SERVER_PORT: ${DL_SERVER_PORT}
    ports:
      - "${APP_PORT}:80"
