services:
  pc:
    container_name: digiledger_figma_pc
    build:
      context: ../..
      dockerfile: deploy/figma/pc.Dockerfile
    environment:
      DL_API_UPSTREAM: ${DL_API_UPSTREAM:-http://host.docker.internal:8080}
    ports:
      - "${DL_PC_PORT:-5200}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  h5:
    container_name: digiledger_figma_h5
    build:
      context: ../..
      dockerfile: deploy/figma/h5.Dockerfile
    environment:
      DL_API_UPSTREAM: ${DL_API_UPSTREAM:-http://host.docker.internal:8080}
    ports:
      - "${DL_H5_PORT:-5201}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
