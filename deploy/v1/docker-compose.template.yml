name: ${COMPOSE_PROJECT_NAME:-digiledger-v1}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_CONSOLE_PORT}:9001"

  backend:
    build:
      context: ../../backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DL_DB_HOST: mysql
      DL_DB_PORT: 3306
      DL_DB_NAME: ${MYSQL_DATABASE}
      DL_DB_USER: root
      DL_DB_PASS: ${MYSQL_ROOT_PASSWORD}
      DL_SERVER_PORT: 8080
      DL_STORAGE_PROVIDER: minio
      DL_STORAGE_ENDPOINT: http://minio:9000
      DL_STORAGE_BUCKET: digiledger
      DL_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      DL_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      DL_STORAGE_BASE_URL: ${DL_STORAGE_BASE_URL}
      DL_BING_IMAGE_API_KEY: ${DL_BING_IMAGE_API_KEY}

  frontend:
    build:
      context: ../..
      dockerfile: deploy/v1/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT}:80"

volumes:
  mysql_data:
  minio_data:
