openapi: 3.0.3
info:
  title: DigiLedger API
  version: 0.4.1
  description: |
    DigiLedger 后端接口，统一返回体为 `{code,data,msg}`。
servers:
  - url: http://localhost/api
paths:
  /api/files/upload:
    post:
      summary: 上传文件（MinIO）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseFile'
  /api/files/remove-bg:
    post:
      summary: 一键抠图封面
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveBgReq'
      responses:
        '200':
          description: 抠图完成后的封面信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRemoveBg'
  /api/attachments/upload:
    post:
      summary: 上传并保存附件
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 待上传文件
                biz_type:
                  type: string
                  description: 业务类型，如 ASSET、PURCHASE、SALE、WISHLIST 等，可为空以便后续绑定。
                biz_id:
                  type: integer
                  format: int64
                  description: 业务主键 ID，可为空。
                extra:
                  type: string
                  description: 附加 JSON 描述，可为空。
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAttachment'
  /api/attachments:
    get:
      summary: 按业务查询附件列表
      parameters:
        - in: query
          name: biz_type
          required: true
          schema:
            type: string
          description: 业务类型，如 ASSET、PURCHASE、SALE、WISHLIST 等。
        - in: query
          name: biz_id
          required: true
          schema:
            type: integer
            format: int64
          description: 业务主键 ID。
      responses:
        '200':
          description: 附件列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAttachmentList'
  /api/attachments/{id}:
    delete:
      summary: 删除附件
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /api/dict/brands:
    get:
      summary: 获取品牌字典列表
      responses:
        '200':
          description: 品牌列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBrandList'
    post:
      summary: 新增品牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandCreateReq'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseLong'
  /api/dict/brands/{id}:
    put:
      summary: 更新品牌
      parameters:
        - $ref: '#/components/parameters/BrandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandUpdateReq'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
    delete:
      summary: 删除品牌
      parameters:
        - $ref: '#/components/parameters/BrandId'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /api/assets:
    get:
      summary: 资产列表
      parameters:
        - in: query
          name: status
          schema:
            type: string
          description: 资产状态过滤（如 USING/IDLE/TO_SELL/SOLD 等）。
        - in: query
          name: keyword
          schema:
            type: string
          description: 关键字搜索，等价于 `q`。
        - in: query
          name: view
          schema:
            type: string
            enum: [table, card]
          description: 列表视图模式，`card` 将返回卡片视图使用的扩展字段。
        - in: query
          name: category_id
          schema:
            type: integer
          description: 支持父级 + 子孙类别过滤；传父级 ID 时将自动包含所有后代类别。
        - in: query
          name: platform_id
          schema:
            type: integer
          description: 按购买平台过滤，匹配任一关联购买记录。
        - in: query
          name: brand_id
          schema:
            type: integer
          description: 按品牌过滤。
        - in: query
          name: tag_ids
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: false
          description: 多个标签 ID，使用逗号分隔，需同时命中全部标签。
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: 页码，从 1 开始。
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
          description: 每页数量。
      responses:
        '200':
          description: 列表返回
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAssetSummaries'
    post:
      summary: 新建资产
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreateReq'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseLong'
  /api/assets/{id}:
    get:
      summary: 资产详情
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: 详情返回
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAssetDetail'
    put:
      summary: 更新资产
      parameters:
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetUpdateReq'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
    delete:
      summary: 删除资产
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /api/assets/{id}/status:
    patch:
      summary: 修改资产状态（卡片/列表行内）
      parameters:
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetStatusReq'
      responses:
        '200':
          description: 状态更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /api/assets/{id}/sell:
    post:
      summary: 出售向导
      parameters:
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellReq'
      responses:
        '200':
          description: 售出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSale'
  /api/assets/{assetId}/cover/suggestions:
    get:
      summary: 智能找图设封面建议
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - name: query
          in: query
          schema:
            type: string
          description: 搜索关键字，默认使用物品名称+品牌+类别
        - name: provider
          in: query
          schema:
            type: string
          description: 指定智能找图服务编码，留空则按默认顺序依次尝试
      responses:
        '200':
          description: 获取候选图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCoverSuggestions'
  /api/assets/{assetId}/cover/from-url:
    post:
      summary: 通过远程图片设置封面
      parameters:
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoverFromUrlReq'
      responses:
        '200':
          description: 封面设置结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCoverApply'
  /api/purchases:
    post:
      summary: 新增购买记录（含附属品/服务）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseCreateReq'
      responses:
        '200':
          description: 新建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePurchase'
  /api/purchases/{id}:
    put:
      summary: 更新购买记录
      parameters:
        - $ref: '#/components/parameters/PurchaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseUpdateReq'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePurchase'
    delete:
      summary: 删除购买记录
      parameters:
        - $ref: '#/components/parameters/PurchaseId'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /api/wishlist:
    get:
      summary: 心愿单列表
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: ['未购买', '已购买']
          description: 按状态筛选心愿单。
      responses:
        '200':
          description: 列表返回
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWishlistList'
    post:
      summary: 新增心愿
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishlistReq'
      responses:
        '200':
          description: 新建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseLong'
  /api/wishlist/{id}:
    get:
      summary: 心愿详情
      parameters:
        - $ref: '#/components/parameters/WishlistId'
      responses:
        '200':
          description: 详情返回
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWishlist'
    put:
      summary: 更新心愿
      parameters:
        - $ref: '#/components/parameters/WishlistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishlistReq'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
    delete:
      summary: 删除心愿
      parameters:
        - $ref: '#/components/parameters/WishlistId'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /api/wishlist/{id}/convert:
    post:
      summary: 心愿转资产
      parameters:
        - $ref: '#/components/parameters/WishlistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreateReq'
      responses:
        '200':
          description: 转换成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseLong'  /api/image-search/providers:
    get:
      summary: 获取可用的智能找图服务
      responses:
        '200':
          description: 服务列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseImageSearchProviders'

  /api/image-search/providers/default:
    put:
      summary: 更新默认智能找图服务
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDefaultImageSearchProviderRequest'
      responses:
        '200':
          description: 设置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'


  /api/wishlist/{id}/price:
    patch:
      summary: 记录心愿单当前价格
      parameters: [{ $ref: '#/components/parameters/WishlistId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WishlistPriceRequest' }
      responses:
        '200': { description: 更新成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseVoid' } } } }
  /api/wishlist/{id}/price-history:
    get:
      summary: 查询心愿单价格历史（按采集时间倒序）
      parameters: [{ $ref: '#/components/parameters/WishlistId' }]
      responses:
        '200': { description: 价格历史, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponsePriceHistory' } } } }
  /api/wishlist/{id}/mark-purchased:
    post:
      summary: 标记心愿为已购买（不强制创建物品）
      parameters: [{ $ref: '#/components/parameters/WishlistId' }]
      responses:
        '200': { description: 标记成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseVoid' } } } }
  /api/dashboard/summary:
    get:
      summary: 获取资产总览、分布、趋势与最近更新
      responses:
        '200': { description: 聚合总览, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseDashboardSummary' } } } }
  /api/upgrade-routes:
    get:
      summary: 升级路线列表（含预算和状态汇总）
      responses:
        '200': { description: 路线列表 }
    post:
      summary: 新增升级路线
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpgradeRouteRequest' } } } }
      responses:
        '200': { description: 路线 ID, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseLong' } } } }
  /api/upgrade-routes/{routeId}:
    put:
      summary: 更新升级路线
      parameters:
        - { name: routeId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpgradeRouteRequest' } } } }
      responses:
        '200': { description: 更新成功 }
  /api/upgrade-routes/{routeId}/nodes/{nodeId}:
    put:
      summary: 更新升级节点
      parameters:
        - { name: routeId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: nodeId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpgradeNodeRequest' } } } }
      responses:
        '200': { description: 更新成功 }
  /api/settings/preferences:
    get:
      summary: 获取展示和自动备份偏好
      responses:
        '200': { description: 当前偏好, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponsePreferences' } } } }
    put:
      summary: 更新展示和自动备份偏好
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Preferences' } } } }
      responses:
        '200': { description: 更新成功 }
  /api/data/export:
    get:
      summary: 导出资产数据；内容仍包装在统一 ApiResponse.data 中
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
      responses:
        '200': { description: 导出内容, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseDataExport' } } } }

components:
  parameters:
    AssetId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: 资产 ID。
    WishlistId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: 心愿 ID。
    BrandId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: 品牌 ID。
    PurchaseId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: 购买记录 ID。
    AttachmentId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 附件 ID。
  schemas:
    ApiResponseVoid:
      type: object
      properties:
        code:
          type: integer
        data:
          nullable: true
        msg:
          type: string
    ApiResponseLong:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
      properties:
        data:
          type: integer
    ApiResponseFile:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
      properties:
        data:
          type: object
          properties:
            objectKey:
              type: string
              description: 上传对象在存储中的 objectKey
            url:
              type: string
              description: 根据 storage_base_url 拼接后的完整访问 URL
    ApiResponseAttachment:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
      properties:
        data:
          $ref: '#/components/schemas/Attachment'
    ApiResponseAttachmentList:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
    ApiResponseImageSearchProviders:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
      properties:
        data:
          $ref: '#/components/schemas/ImageSearchProviderList'
    ImageSearchProviderList:
      type: object
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ImageSearchProvider'
        defaultProvider:
          type: string
          nullable: true
    ImageSearchProvider:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
          nullable: true
    UpdateDefaultImageSearchProviderRequest:
      type: object
      properties:
        provider:
          type: string
          nullable: true

    Attachment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        bizType:
          type: string
          nullable: true
        bizId:
          type: integer
          format: int64
          nullable: true
        objectKey:
          type: string
        url:
          type: string
        fileName:
          type: string
          nullable: true
        fileType:
          type: string
          nullable: true
        fileSize:
          type: integer
          format: int64
          nullable: true
        extra:
          type: string
          nullable: true
          description: JSON 扩展信息
        createdAt:
          type: string
          format: date-time
    ApiResponseBrandList:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Brand'
    ApiResponseAssetSummaries:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AssetSummary'
    ApiResponseAssetDetail:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
      properties:
        data:
          $ref: '#/components/schemas/AssetDetail'
    CoverSuggestion:
      type: object
      properties:
        thumb_url:
          type: string
          nullable: true
          description: 缩略图地址
        source_url:
          type: string
          description: 原图地址
    ApiResponseCoverSuggestions:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CoverSuggestion'
    CoverApplyResponse:
      type: object
      properties:
        attachment_id:
          type: integer
          format: int64
        url:
          type: string
        object_key:
          type: string
    ApiResponseCoverApply:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
      properties:
        data:
          $ref: '#/components/schemas/CoverApplyResponse'
    CoverFromUrlReq:
      type: object
      required: [source_url]
      properties:
        source_url:
          type: string
          description: 原图 URL
    RemoveBgReq:
      type: object
      required: [asset_id]
      properties:
        asset_id:
          type: integer
          format: int64
        attachment_id:
          type: integer
          format: int64
          nullable: true
        cover_url:
          type: string
          nullable: true
    RemoveBgResp:
      type: object
      properties:
        attachment_id:
          type: integer
          format: int64
        url:
          type: string
    ApiResponseRemoveBg:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
      properties:
        data:
          $ref: '#/components/schemas/RemoveBgResp'
    ApiResponseSale:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
      properties:
        data:
          $ref: '#/components/schemas/Sale'
    ApiResponsePurchase:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
      properties:
        data:
          $ref: '#/components/schemas/Purchase'
    ApiResponseWishlistList:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Wishlist'
    ApiResponseWishlist:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
      properties:
        data:
          $ref: '#/components/schemas/Wishlist'
    Brand:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        alias:
          type: string
          nullable: true
        initial:
          type: string
          nullable: true
        sort:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BrandCreateReq:
      type: object
      required: [name]
      properties:
        name:
