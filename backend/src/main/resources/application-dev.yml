server:
  port: ${DL_SERVER_PORT:18080}

spring:
  datasource:
    url: jdbc:mysql://${DL_DB_HOST:srv.vm}:${DL_DB_PORT:3306}/${DL_DB_NAME:digi_ledger}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: ${DL_DB_USER:root}
    password: ${DL_DB_PASS:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
  # 上传文件大小限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
    com.digiledger: DEBUG

app:
  upload:
    max-size-mb: 50
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
  storage:
    provider: minio
    endpoint: http://srv.vm:19000
    region:
    bucket: digiledger
    access-key: IZl6ZJ8oJ9Yn61T3
    secret-key: skI5U6T1s07ZXl2YAtROmr3qPTJUUnK1
    base-url: http://srv.vm:19000
