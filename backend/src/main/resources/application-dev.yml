server:
  port: ${DL_SERVER_PORT:18080}

spring:
  datasource:
    url: jdbc:mysql://${DL_DB_HOST:srv.vm}:${DL_DB_PORT:3306}/${DL_DB_NAME:digi_ledger}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: ${DL_DB_USER:root}
    password: ${DL_DB_PASS:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
  # 上传文件大小限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
    com.digiledger: DEBUG

app:
  upload:
    max-size-mb: 50
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
  storage:
    provider: ${DL_STORAGE_PROVIDER:minio}
    endpoint: ${DL_STORAGE_ENDPOINT:http://srv.vm:19000}
    region: ${DL_STORAGE_REGION:}
    bucket: ${DL_STORAGE_BUCKET:digiledger}
    access-key: ${DL_STORAGE_ACCESS_KEY:sonic}
    secret-key: ${DL_STORAGE_SECRET_KEY:12345678}
    base-url: ${DL_STORAGE_BASE_URL:http://srv.vm:19000}
