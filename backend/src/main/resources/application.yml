server:
  port: ${DL_SERVER_PORT:8080}

spring:
  flyway:
    enabled: ${DL_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # 兼容已部署但尚未纳入 Flyway 管理的数据库，避免重建已有数据。
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: pre-flyway-schema
  datasource:
    url: jdbc:mysql://${DL_DB_HOST:mysql}:${DL_DB_PORT:3306}/${DL_DB_NAME:digiledger}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: ${DL_DB_USER:root}
    password: ${DL_DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
    com.digiledger: DEBUG

app:
  cors:
    # 逗号分隔；生产部署时通过环境变量仅放行实际 H5 域名。
    allowed-origin-patterns: "${DL_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],https://localhost,https://localhost:[*],http://127.0.0.1:[*],http://[::1]:[*],http://10.*:[*],http://172.*:[*],http://192.168.*:[*]}"
  upload:
    max-size-mb: 5
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
  storage:
    provider: ${DL_STORAGE_PROVIDER:minio}
    endpoint: ${DL_STORAGE_ENDPOINT:http://localhost:9000}
    region: ${DL_STORAGE_REGION:}
    bucket: ${DL_STORAGE_BUCKET:digiledger}
    access-key: ${DL_STORAGE_ACCESS_KEY:}
    secret-key: ${DL_STORAGE_SECRET_KEY:}
    base-url: ${DL_STORAGE_BASE_URL:}
