version: '3.9'
services:
  backend:
    container_name: digi_backend
    build:
      context: ./backend
    environment:
      DL_DB_HOST: mysql
      DL_DB_PORT: 3306
      DL_DB_NAME: digiledger
      DL_DB_USER: root
      DL_DB_PASS: root
      DL_SERVER_PORT: 8080
      DL_STORAGE_PROVIDER: minio
      DL_STORAGE_ENDPOINT: http://minio:9000
      DL_STORAGE_BUCKET: digiledger
      DL_STORAGE_ACCESS_KEY: minioadmin
      DL_STORAGE_SECRET_KEY: minioadmin
      DL_STORAGE_BASE_URL: http://localhost:9000
      DL_BING_IMAGE_API_KEY: ""
    ports:
      - "5101:8080"
    networks:
      - digiledger
  frontend:
    container_name: digi_frontend
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE: /api
    networks:
      - digiledger
  nginx:
    container_name: digi_nginx
    image: nginx:1.25
    depends_on:
      - frontend
      - backend
    ports:
      - "5100:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - digiledger
networks:
  digiledger:
    driver: bridge
